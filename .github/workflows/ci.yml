name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on PR pushes so only the latest commit's CI finishes.
# main builds are never cancelled — every merge leaves a complete run record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run knip
        run: bun run knip

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck
        working-directory: apps/web

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
        working-directory: apps/web

  migrations-apply-check:
    name: Migrations Apply Check
    runs-on: ubuntu-latest
    # Apply every supabase/migrations/*.sql to a throwaway Postgres in filename
    # order and fail fast on the first runtime SQL error. Catches the class of
    # bug that parses fine but fails at APPLY time — a duplicate-key seed, a
    # column that doesn't exist, an FK to a missing table, an incompatible
    # ALTER. Those otherwise surface only as an opaque Supabase-branch failure
    # (or, when that check is skipped/cancelled, straight in production — see
    # the 074 itinerary-seed incident).
    #
    # scripts/supabase-compat-shim.sql runs first to create the Supabase-managed
    # roles + auth.role() our RLS policies reference. Plain postgres:17 (NOT the
    # ~3GB supabase/postgres image) keeps the pull small; the apply path
    # (scripts/migrations-apply-scratch.ts) uses only Node builtins + psql, so
    # the job needs no `bun install`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify psql is available
        run: psql --version

      - name: Apply migrations to scratch Postgres
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun run migrations:apply-scratch

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint, knip, typecheck, test]
    concurrency:
      group: e2e-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: read
      statuses: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for Vercel preview deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        id: vercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          path: /api/health
          vercel_password: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Reset preview database
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST \
            "${{ steps.vercel.outputs.url }}/api/e2e/reset" \
            -H "x-e2e-reset-token: ${{ secrets.E2E_RESET_SECRET }}")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Database reset failed with HTTP $http_code"
            exit 1
          fi

      - name: Run E2E tests
        run: bun run test:e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel.outputs.url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          NEXT_PUBLIC_ADMIN_EMAILS: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAILS }}
          E2E_RESET_SECRET: ${{ secrets.E2E_RESET_SECRET }}

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
